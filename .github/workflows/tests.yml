name: tests

on:
  push:
    branches: ["**"]
  pull_request:

# A PR branch runs under both triggers; cancel the superseded run instead of paying for it twice.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows is here because this package drives git and reads package files byte for byte.
        # Line endings and path separators are exactly the things that break there and nowhere else.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        # --locked fails on a drifted uv.lock instead of silently re-resolving it.
        # --no-build keeps third-party sdist build code from running during install;
        # --no-binary-package exempts renovate-apply itself, which only exists as source.
        run: uv sync --locked --no-build --no-binary-package renovate-apply --group test

      - name: Run tests
        run: uv run --locked --no-build --no-binary-package renovate-apply pytest

      - name: Upload coverage to Codecov
        # Upload even when a test fails: pytest-cov still writes the report at session end.
        # One OS is enough for coverage; the other legs only gate behavior.
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: reports/coverage.xml

      - name: Upload coverage report
        # Shared with the sonarcloud job so the suite runs once and both tools report the same data.
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: reports/coverage.xml
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dev dependencies
        run: uv sync --locked --no-build --no-binary-package renovate-apply --group dev --group test

      - name: ruff check
        run: uv run --locked --no-build --no-binary-package renovate-apply ruff check .

      - name: ruff format
        run: uv run --locked --no-build --no-binary-package renovate-apply ruff format --check .

      - name: ty type check
        run: uv run --locked --no-build --no-binary-package renovate-apply ty check

  sonarcloud:
    # Reuse the coverage report from unit-tests instead of running the suite twice.
    needs: unit-tests
    # Skip the heavy scan on Renovate's automated dependency PRs (they touch the lockfile, not
    # source). The lint + unit-tests jobs still gate those PRs.
    if: github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # Full history so SonarQube Cloud can blame issues to commits and detect new code.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dev dependencies
        run: uv sync --locked --no-build --no-binary-package renovate-apply --group dev

      - name: Create reports directory
        run: mkdir -p reports

      # ruff and bandit reports feed sonar.python.{ruff,bandit}.reportPaths. exit-zero keeps the
      # JSON written and the job green: the lint job is the gate for ruff, CodeQL/bandit for
      # security.
      - name: Generate ruff report
        run: |
          uv run --locked --no-build --no-binary-package renovate-apply ruff check \
            --output-format=json \
            --output-file=reports/ruff_report.json \
            --exit-zero \
            .

      - name: Generate bandit report
        run: |
          uv run --locked --no-build --no-binary-package renovate-apply bandit \
            --configfile pyproject.toml \
            --recursive \
            --format json \
            --output reports/bandit_report.json \
            --exit-zero \
            .

      - name: Download coverage report
        # coverage.xml is produced by unit-tests; feeds sonar.python.coverage.reportPaths.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: reports

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_SKIP_JRE_PROVISIONING: true
          # Fill the ${env.*} placeholders in sonar-project.properties. Not secret. EU region uses
          # the default sonarcloud.io host, so SONAR_HOST_URL is intentionally omitted.
          SONAR_ORGANIZATION: jbsilva
          SONAR_PROJECT_KEY: jbsilva_renovate-apply
