[project]
name = "renovate-apply"
version = "0.1.0"
description = "Apply the dependency updates Renovate finds, locally, without a pull request"
readme = "README.md"
requires-python = ">=3.15,<4"
authors = [{ name = "Julio Batista Silva", email = "python@juliobs.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "renovate",
    "dependencies",
    "updates",
    "cli",
    "docker",
    "pre-commit",
    "github-actions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "cyclopts>=5.2.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "poethepoet>=0.48.0",
    "pycroscope>=0.5.0",
    "ruff>=0.17.0",
    "ty>=0.0.85",
    "zizmor>=1.30.1",
    "zuban>=0.10.0",
]
test = [
    "pytest-cov>=7.1.0",
    "pytest-random-order>=1.2.0",
    "pytest-xdist[psutil]>=3.8.0",
    "pytest>=9.1.1",
]

[project.urls]
Repository = "https://github.com/jbsilva/renovate-apply"
Issues = "https://github.com/jbsilva/renovate-apply/issues"

[project.scripts]
renovate-apply = "renovate_apply.main:main"
# Short alias, because this is typed often and interactively. It is the same entry point.
rnv = "renovate_apply.main:main"

[tool.uv]
# `uv run pytest` is the documented way to run the suite, and uv syncs to the default groups before
# it runs anything, so test has to be one of them or pytest is uninstalled on the way in.
default-groups = ["dev", "test"]
exclude-newer = "1 day"

[tool.uv.exclude-newer-package]
cyclopts = "6 hours"
ruff = "6 hours"
zuban = "6 hours"

[build-system]
requires = ["uv_build>=0.12.23,<1.0.0"]
build-backend = "uv_build"

[tool.poe]
executor.type = "uv"

[tool.poe.tasks.lint]
help = "Lint with ruff and apply its fixes"
cmd = "ruff check --fix ."

[tool.poe.tasks.format]
help = "Format the code with ruff"
cmd = "ruff format ."

[tool.poe.tasks.typecheck]
help = "Type check with ty"
cmd = "ty check"

[tool.poe.tasks.zuban]
help = "Strict type check with zuban, which no hook or CI job runs"
cmd = "zuban check"

[tool.poe.tasks.pycroscope]
help = "Semi-static analysis with pycroscope, which no hook or CI job runs"
cmd = "pycroscope --config-file pyproject.toml"

[tool.poe.tasks.hooks]
help = "Run every prek hook on all files"
cmd = "prek run -a"
executor = { with = ["prek"] }

[tool.poe.tasks.check]
help = "Run all the checks to do before a commit"
sequence = ["lint", "format", "typecheck", "hooks"]

[tool.poe.tasks.test]
help = "Run the test suite (extra arguments go to pytest)"
cmd = "pytest"

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py315"
fix = true
unsafe-fixes = false

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001", # missing-copyright-notice: this project has no copyright-header policy
    "D203",   # one-blank-line-before-class
    "D212",   # multi-line-summary-first-line
    "D413",   # blank-line-after-last-section
]

[tool.ruff.lint.per-file-ignores]
"**/tests/{test_*.py,conftest.py,helpers.py}" = [
    "S101",    # Allow assert in tests
    "S603",    # The suite drives git itself; the argv is fixed and built right there
    "S607",    # ditto: git comes from PATH, as it does everywhere else in this package
    "ARG001",  # Allow unused arguments in tests (for pytest fixtures)
    "INP001",  # No __init__.py needed - pytest uses --import-mode=importlib
    "TC001",   # Keep imports at runtime in tests; the import-cost the TC rules guard is irrelevant
    "TC002",   # here, and a TYPE_CHECKING block for a test's own framework import reads oddly.
    "TC003",
    "PLR2004", # A literal version string reads better in the assertion than as a constant above it
]
"**/__init__.py" = [
    "D104", # Allow empty __init__.py files
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
lines-after-imports = 2

[tool.docformatter]
# Reflow docstrings to the project's 100-column width. `pre-summary-newline` keeps the summary on
# the second line to match the active D213 (the D212 alternative is ignored above). The pre-commit
# hook passes `--in-place`; a bare `docformatter src` only prints a diff.
recursive = true
wrap-summaries = 100
wrap-descriptions = 100
pre-summary-newline = true

[tool.ty.terminal]
# A warning is a finding like any other: it fails the hook and CI instead of scrolling past.
error-on-warning = true

[tool.zuban]
strict = true
disallow_untyped_defs = true
warn_unreachable = true
python_executable = ".venv/bin/python"

[tool.pycroscope]
# Directory to analyze (relative to pyproject.toml) and the import root for the src layout
paths = ["src/renovate_apply"]
import_paths = ["src"]

# Output one issue per line, easier to scan and grep.
output_format = "concise"

# Checks
possibly_undefined_name = true
unused_variable = true
value_always_true = true
use_fstrings = true
missing_return_annotation = true
missing_parameter_annotation = true
suggested_parameter_type = true
suggested_return_type = true
incompatible_override = true
missing_generic_parameters = true

# Tests intentionally use loose typing and assert helpers that pycroscope would flag as suggestions
[[tool.pycroscope.overrides]]
module = "tests"
missing_return_annotation = false
missing_parameter_annotation = false
suggested_parameter_type = false
suggested_return_type = false

[tool.bandit]
exclude_dirs = [".git", ".venv", "__pycache__", "tests"]

[tool.bandit.assert_used]
skips = ['tests/test_*.py']

[tool.pytest.ini_options]
# tests/ on the path so the modules there can import `helpers`. Under --import-mode=importlib a
# test module is not part of a package, so a plain `from helpers import ...` would not resolve.
pythonpath = ["tests"]
addopts = [
    "-ra",
    "--durations=10",
    "--import-mode=importlib",
    "--random-order",
    "--numprocesses=logical",
    "--dist=load",
    "--tb=short",
    "--verbose",
    "--cov=src/renovate_apply",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml:reports/coverage.xml",
]
# Warnings are errors: a new DeprecationWarning from a dependency bump (the exact thing this tool
# ships) must fail the suite instead of scrolling past.
filterwarnings = ["error"]
