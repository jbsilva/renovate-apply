[project]
name = "renovate-apply"
version = "0.1.0"
description = "Apply the dependency updates Renovate finds, locally, without a pull request"
readme = "README.md"
requires-python = ">=3.15,<4"
authors = [{ name = "Julio Batista Silva", email = "python@juliobs.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "renovate",
    "dependencies",
    "updates",
    "cli",
    "docker",
    "pre-commit",
    "github-actions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Software Distribution",
]
dependencies = []

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "poethepoet>=0.48.0",
    "pycroscope>=0.5.0",
    "ruff>=0.17.0",
    "ty>=0.0.85",
    "zuban>=0.10.0",
]

[project.urls]
Repository = "https://github.com/jbsilva/renovate-apply"
Issues = "https://github.com/jbsilva/renovate-apply/issues"

[tool.uv]
exclude-newer = "1 day"

[tool.uv.exclude-newer-package]
ruff = "6 hours"
zuban = "6 hours"

[build-system]
requires = ["uv_build>=0.12.23,<1.0.0"]
build-backend = "uv_build"

[tool.poe]
executor.type = "uv"

[tool.poe.tasks.lint]
help = "Lint with ruff and apply its fixes"
cmd = "ruff check --fix ."

[tool.poe.tasks.format]
help = "Format the code with ruff"
cmd = "ruff format ."

[tool.poe.tasks.typecheck]
help = "Type check with ty"
cmd = "ty check"

[tool.poe.tasks.zuban]
help = "Strict type check with zuban, which no hook or CI job runs"
cmd = "zuban check"

[tool.poe.tasks.pycroscope]
help = "Semi-static analysis with pycroscope, which no hook or CI job runs"
cmd = "pycroscope --config-file pyproject.toml"

[tool.poe.tasks.hooks]
help = "Run every prek hook on all files"
cmd = "prek run -a"
executor = { with = ["prek"] }

[tool.poe.tasks.check]
help = "Run all the checks to do before a commit"
sequence = ["lint", "format", "typecheck", "hooks"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py315"
fix = true
unsafe-fixes = false

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001", # missing-copyright-notice: this project has no copyright-header policy
    "D203",   # one-blank-line-before-class
    "D212",   # multi-line-summary-first-line
    "D413",   # blank-line-after-last-section
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "D104", # Allow empty __init__.py files
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
lines-after-imports = 2

[tool.docformatter]
# Reflow docstrings to the project's 100-column width. `pre-summary-newline` keeps the summary on
# the second line to match the active D213 (the D212 alternative is ignored above). The pre-commit
# hook passes `--in-place`; a bare `docformatter src` only prints a diff.
recursive = true
wrap-summaries = 100
wrap-descriptions = 100
pre-summary-newline = true

[tool.ty.terminal]
# A warning is a finding like any other: it fails the hook and CI instead of scrolling past.
error-on-warning = true

[tool.zuban]
strict = true
disallow_untyped_defs = true
warn_unreachable = true
python_executable = ".venv/bin/python"

[tool.pycroscope]
# Directory to analyze (relative to pyproject.toml) and the import root for the src layout
paths = ["src/renovate_apply"]
import_paths = ["src"]

# Output one issue per line, easier to scan and grep.
output_format = "concise"

# Checks
possibly_undefined_name = true
unused_variable = true
value_always_true = true
use_fstrings = true
missing_return_annotation = true
missing_parameter_annotation = true
suggested_parameter_type = true
suggested_return_type = true
incompatible_override = true
missing_generic_parameters = true

[tool.bandit]
exclude_dirs = [".git", ".venv", "__pycache__", "tests"]

[tool.bandit.assert_used]
skips = ['tests/test_*.py']
