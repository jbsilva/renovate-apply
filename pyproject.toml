[project]
name = "renovate-apply"
version = "0.1.0"
description = "Apply the dependency updates Renovate finds, locally, without a pull request"
readme = "README.md"
requires-python = ">=3.15"
authors = [{ name = "Julio Batista Silva", email = "python@juliobs.com" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
renovate-apply = "renovate_apply:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
