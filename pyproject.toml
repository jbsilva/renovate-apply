[project]
name = "renovate-apply"
version = "0.1.0"
description = "Apply the dependency updates Renovate finds, locally, without a pull request"
readme = "README.md"
requires-python = ">=3.15"
authors = [{ name = "Julio Batista Silva", email = "python@juliobs.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "renovate",
    "dependencies",
    "updates",
    "cli",
    "docker",
    "pre-commit",
    "github-actions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Software Distribution",
]
dependencies = []

[project.urls]
Repository = "https://github.com/jbsilva/renovate-apply"
Issues = "https://github.com/jbsilva/renovate-apply/issues"

[project.scripts]
renovate-apply = "renovate_apply:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
