# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# The cspell hook below runs on the commit message, which is a stage a plain `prek install` does not
# wire up. Naming both here means one command installs both.
default_install_hook_types = ["pre-commit", "commit-msg"]

# A hook that names no stage runs in every one of them, so without this the whole list runs a second
# time to check the commit message.
default_stages = ["pre-commit"]

# prek runs these natively: nothing cloned, no environment, no revision to keep current.
[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.13.0"
hooks = [{ id = "uv-lock" }]

# Docformatter: format docstrings and make sure we use 100 columns.
# See [tool.docformatter] in pyproject.toml. Must run before ruff.
[[repos]]
repo = "https://github.com/PyCQA/docformatter"
rev = "v1.7.8"
hooks = [
  { id = "docformatter", args = [
    "--in-place",
    "--config",
    "./pyproject.toml",
  ] },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.0"
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/PyCQA/bandit"
rev = "1.9.4"
hooks = [
  { id = "bandit", args = [
    "-c",
    "pyproject.toml",
  ], additional_dependencies = ["bandit[toml]"] },
]

[[repos]]
repo = "https://github.com/asottile/pyupgrade"
rev = "v3.22.0"
hooks = [{ id = "pyupgrade", args = ["--py315-plus"] }]

[[repos]]
repo = "https://github.com/streetsidesoftware/cspell-cli"
rev = "v10.3.0"
hooks = [
  # Spell check changed files.
  { id = "cspell" },
  # Spell check the commit message.
  { id = "cspell", name = "check commit message spelling", args = [
    "--no-must-find-files",
    "--no-progress",
    "--no-summary",
    "--files",
    ".git/COMMIT_EDITMSG",
  ], stages = ["commit-msg"], always_run = true },
]

# Local hooks run the tool already installed in the project venv, so the hook, CI, and the commands
# AGENTS.md documents all execute the same locked version. ty also needs that venv to resolve the
# project's own third-party imports.
[[repos]]
repo = "local"

# Whole project, never a file list: a change in one file can break a caller in another.
[[repos.hooks]]
id = "ty"
name = "ty type check"
entry = "uv run ty check"
language = "system"
types = ["python"]
pass_filenames = false
require_serial = true
always_run = true
