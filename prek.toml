# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# prek runs these natively: nothing cloned, no environment, no revision to keep current.
[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.13.0"
hooks = [{ id = "uv-lock" }]

# Docformatter: format docstrings and make sure we use 100 columns.
# See [tool.docformatter] in pyproject.toml. Must run before ruff.
[[repos]]
repo = "https://github.com/PyCQA/docformatter"
rev = "v1.7.8"
hooks = [
  { id = "docformatter", args = [
    "--in-place",
    "--config",
    "./pyproject.toml",
  ] },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.0"
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/asottile/pyupgrade"
rev = "v3.22.0"
hooks = [{ id = "pyupgrade", args = ["--py315-plus"] }]
